<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fb;
            font-family: 'Noto Sans KR', sans-serif;
            color: #202b38;
        }

        .login-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .login-title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .login-box {
            background: #ffffff;
            padding: 40px;
            border: 1px solid #e8ebef;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid #d5dbe3;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #26384d;
        }

        .input-group input::placeholder {
            color: #a0aaba;
        }

        .login-button {
            width: 100%;
            height: 54px;
            margin-top: 8px;
            background: #202d3d;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #34485f;
        }

        .error-message {
            margin-top: 25px;
            text-align: center;
            color: #dc5252;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 22px;
            }

            .login-title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <h2 class="login-title">로그인</h2>

    <div class="login-box">

        <form th:action="@{/login}" method="post">

            <!-- CSRF 토큰 -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <div class="input-group">
                <label for="username">아이디</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="아이디를 입력하세요"
                       required
                       maxlength="20">
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="비밀번호를 입력하세요"
                       required
                       maxlength="72">
            </div>

            <button type="submit" class="login-button">
                로그인
            </button>

        </form>

    </div>

    <!-- 로그인 실패 시에만 표시 -->
    <p class="error-message" th:if="${param.error}">
        아이디 또는 비밀번호를 확인해주세요.
    </p>

</div>

</body>
</html>
