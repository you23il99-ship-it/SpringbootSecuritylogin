<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
            font-family: Arial, sans-serif;
            color: #222;
        }

        .login-container {
            width: 400px;
            padding: 45px 40px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 14px;
            color: #888;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #3867e8;
        }

        .login-button {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #3867e8;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #2852c7;
        }

        .error-message {
            margin-bottom: 18px;
            padding: 11px;
            border-radius: 6px;
            background: #fff0f0;
            color: #d93025;
            font-size: 13px;
            text-align: center;
        }

        .signup-link {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #888;
        }

        .signup-link a {
            margin-left: 5px;
            color: #3867e8;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-header">
        <h2>로그인</h2>
        <p>서비스 이용을 위해 로그인해 주세요.</p>
    </div>

    <form th:action="@{/login}" method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div th:if="${error}" class="error-message"
             th:text="${error}"></div>

        <div class="form-group">
            <label for="username">아이디</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="아이디를 입력하세요"
                   required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="비밀번호를 입력하세요"
                   required>
        </div>

        <button type="submit" class="login-button">
            로그인
        </button>

    </form>

    <div class="signup-link">
        아직 회원이 아니신가요?
        <a th:href="@{/signup}">회원가입</a>
    </div>

</div>

</body>
</html>
